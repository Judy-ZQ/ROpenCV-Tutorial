name: Deploy book to GitHub Pages

# 仓库里只放渲染结果（_book/）。这个工作流不做任何构建，直接把 _book/ 作为
# 站点根目录发布，所以 https://judy-zq.github.io/ROpenCV-Tutorial/ 打开就是书。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布任务，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check book output
        run: |
          test -f _book/index.html || { echo "::error::_book/index.html 不存在，先本地运行 quarto render"; exit 1; }
          echo "_book 文件数: $(find _book -type f | wc -l)"
          du -sh _book

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
